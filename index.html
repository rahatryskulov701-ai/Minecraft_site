<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minecraft Command Center</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --green: #55d65b;
    --green-dark: #299b35;
    --bg: #080b08;
    --card: rgba(18, 22, 18, .94);
    --border: rgba(110, 255, 120, .22);
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #18351a 0%, #080b08 55%);
}

/* HEADER */

header {
    position: relative;
    padding: 55px 20px 45px;
    text-align: center;

    background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.8));

    border-bottom: 1px solid var(--border);
    overflow: hidden;
}

header::before {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;

    left: 50%;
    top: -250px;

    transform: translateX(-50%);

    background: rgba(85,214,91,.18);
    filter: blur(90px);
}

.logo {
    position: relative;
    font-size: 60px;
    animation: float 3s ease-in-out infinite;
}

h1 {
    position: relative;

    margin: 5px 0 10px;

    font-size: clamp(32px, 7vw, 60px);

    text-shadow:
        4px 4px 0 #000,
        0 0 25px rgba(85,214,91,.35);
}

header p {
    position: relative;
    color: #b9c3b9;
    font-size: 17px;
}

/* MAIN */

main {
    max-width: 1000px;
    margin: 35px auto;
    padding: 0 15px;
}

/* CARDS */

.card {
    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 18px;

    padding: 24px;
    margin-bottom: 20px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);

    animation: appear .5s ease;
}

.card:hover {
    border-color: rgba(110,255,120,.4);
}

/* TITLES */

h2 {
    margin-top: 0;

    color: var(--green);

    text-shadow: 0 0 12px rgba(85,214,91,.25);
}

/* SEARCH */

.search {
    position: relative;
}

.search input {
    padding-left: 45px;
}

.search span {
    position: absolute;

    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 20px;
}

/* INPUT */

input {
    width: 100%;

    padding: 15px;

    margin-bottom: 12px;

    background: #090c09;

    border: 1px solid #303830;
    border-radius: 12px;

    color: white;

    font-size: 16px;

    outline: none;

    transition: .2s;
}

input:focus {
    border-color: var(--green);

    box-shadow:
        0 0 0 3px rgba(85,214,91,.1);
}

/* BUTTON GRID */

.grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));

    gap: 12px;
}

/* BUTTON */

button {
    position: relative;

    padding: 15px;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            #3db946,
            #23882c
        );

    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 0 #176320,
        0 8px 20px rgba(0,0,0,.25);

    transition:
        transform .15s,
        filter .15s,
        box-shadow .15s;
}

button:hover {
    transform: translateY(-3px);

    filter: brightness(1.15);

    box-shadow:
        0 8px 0 #176320,
        0 12px 25px rgba(0,0,0,.35);
}

button:active {
    transform: translateY(3px);

    box-shadow:
        0 2px 0 #176320;
}

/* COMMAND OUTPUT */

#output {
    margin-top: 16px;

    min-height: 70px;

    padding: 16px;

    background: #050705;

    border: 1px solid #293029;

    border-radius: 12px;

    color: #9cff9f;

    font-family: monospace;

    white-space: pre-wrap;

    overflow-x: auto;
}

/* COPY */

.copy {
    margin-top: 10px;

    width: 100%;

    background:
        linear-gradient(
            145deg,
            #53615a,
            #333b36
        );

    box-shadow: 0 5px 0 #222;
}

.copy:hover {
    filter: brightness(1.2);
}

/* CATEGORY */

.category {
    margin-top: 25px;

    padding-bottom: 8px;

    color: #aaa;

    border-bottom: 1px solid #252b25;
}

/* TOAST */

#toast {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform:
        translate(-50%, 100px);

    background: #151b15;

    border: 1px solid var(--green);

    color: white;

    padding: 13px 20px;

    border-radius: 12px;

    box-shadow: 0 8px 30px rgba(0,0,0,.5);

    opacity: 0;

    transition: .3s;

    z-index: 999;
}

#toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* FOOTER */

footer {
    padding: 35px 15px;

    text-align: center;

    color: #687068;

    font-size: 14px;
}

/* ANIMATIONS */

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MOBILE */

@media(max-width:600px) {

    header {
        padding: 40px 15px;
    }

    .logo {
        font-size: 45px;
    }

    .card {
        padding: 18px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    button {
        padding: 16px;
    }
}
</style>
</head>


<body>

<header>

<div class="logo">⛏️</div>

<h1>Minecraft Command Center</h1>

<p>
⚡ Команды Minecraft Java Edition • Быстро • Удобно • Красиво
</p>

</header>


<main>


<!-- GENERATOR -->

<section class="card">

<h2>⚡ Генератор команд</h2>

<input
    id="player"
    placeholder="Ник игрока (например Steve)"
>

<div class="grid">

<button onclick="giveDiamonds()">
💎 Дать 64 алмаза
</button>

<button onclick="giveFood()">
🍖 Дать еду
</button>

<button onclick="heal()">
❤️ Полностью вылечить
</button>

<button onclick="teleport()">
📍 Телепорт вверх
</button>

</div>

<div id="output">
Выбери команду...
</div>

<button
    class="copy"
    onclick="copyCommand()"
>
📋 Скопировать команду
</button>

</section>


<!-- SEARCH -->

<section class="card">

<h2>🔎 Поиск команд</h2>

<div class="search">

<span>🔍</span>

<input
    id="search"
    placeholder="Например: погода, креатив, алмазы..."
    oninput="searchCommands()"
>

</div>

<div id="commands" class="grid">

<button data-name="инвентарь сохранение keepinventory"
onclick="showCommand('/gamerule keepInventory true')">
🎒 Сохранение инвентаря
</button>

<button data-name="креатив creative"
onclick="showCommand('/gamemode creative')">
🟩 Креатив
</button>

<button data-name="выживание survival"
onclick="showCommand('/gamemode survival')">
⚔️ Выживание
</button>

<button data-name="приключение adventure"
onclick="showCommand('/gamemode adventure')">
🗺️ Приключение
</button>

<button data-name="день time day"
onclick="showCommand('/time set day')">
☀️ День
</button>

<button data-name="ночь time night"
onclick="showCommand('/time set night')">
🌙 Ночь
</button>

<button data-name="погода clear солнце"
onclick="showCommand('/weather clear')">
☀️ Ясная погода
</button>

<button data-name="дождь rain"
onclick="showCommand('/weather rain')">
🌧️ Дождь
</button>

<button data-name="гроза thunder"
onclick="showCommand('/weather thunder')">
⛈️ Гроза
</button>

<button data-name="мирная peaceful"
onclick="showCommand('/difficulty peaceful')">
🕊️ Мирная сложность
</button>

<button data-name="легкая easy"
onclick="showCommand('/difficulty easy')">
🙂 Лёгкая сложность
</button>

<button data-name="сложная hard"
onclick="showCommand('/difficulty hard')">
💀 Сложная сложность
</button>

<button data-name="деревня village найти"
onclick="showCommand('/locate structure minecraft:village_plains')">
🏠 Найти деревню
</button>

<button data-name="портал fortress ад"
onclick="showCommand('/locate structure minecraft:fortress')">
🔥 Найти крепость
</button>

<button data-name="энд город endcity"
onclick="showCommand('/locate structure minecraft:end_city')">
🏰 Найти город Энда
</button>

</div>

</section>


<!-- QUICK COMMANDS -->

<section class="card">

<h2>🚀 Быстрые команды</h2>

<div class="grid">

<button onclick="showCommand('/kill @e[type=item]')">
🗑️ Удалить предметы
</button>

<button onclick="showCommand('/weather clear')">
🌤️ Очистить погоду
</button>

<button onclick="showCommand('/gamerule doDaylightCycle false')">
⏸️ Остановить время
</button>

<button onclick="showCommand('/gamerule doDaylightCycle true')">
▶️ Запустить время
</button>

<button onclick="showCommand('/gamerule mobGriefing false')">
🛡️ Запретить разрушение мобами
</button>

<button onclick="showCommand('/gamerule mobGriefing true')">
💥 Разрешить разрушение мобами
</button>

</div>

</section>


</main>


<footer>

Minecraft Command Center<br>

Made for Minecraft players ⛏️

</footer>


<div id="toast">
✓ Команда скопирована!
</div>


<script>

let currentCommand = "";


/* SHOW COMMAND */

function showCommand(command) {

    currentCommand = command;

    document.getElementById("output").textContent = command;

}


/* PLAYER */

function getPlayer() {

    return (
        document
        .getElementById("player")
        .value
        .trim()
    ) || "@p";

}


/* GENERATOR */

function giveDiamonds() {

    let player = getPlayer();

    showCommand(
        `/give ${player} minecraft:diamond 64`
    );

}


function giveFood() {

    let player = getPlayer();

    showCommand(
        `/give ${player} minecraft:cooked_beef 64`
    );

}


function heal() {

    let player = getPlayer();

    showCommand(
        `/effect give ${player} minecraft:instant_health 1 255 true`
    );

}


function teleport() {

    let player = getPlayer();

    showCommand(
        `/tp ${player} ~ ~10 ~`
    );

}


/* COPY */

async function copyCommand() {

    if (!currentCommand) {

        return;

    }

    try {

        await navigator.clipboard.writeText(
            currentCommand
        );

        showToast();

    }

    catch {

        document.getElementById("output").textContent =
            currentCommand +
            "\n\nСкопируй команду вручную.";

    }

}


/* TOAST */

function showToast() {

    let toast =
        document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 1800);

}


/* SEARCH */

function searchCommands() {

    let query =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let buttons =
        document.querySelectorAll(
            "#commands button"
        );

    buttons.forEach(button => {

        let name =
            button
            .dataset
            .name
            .toLowerCase();

        if (
            name.includes(query)
            || query === ""
        ) {

            button.style.display = "";

        }

        else {

            button.style.display = "none";

        }

    });

}

</script>

</body>
</html>
